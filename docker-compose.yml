services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    environment:
      # Must match the renderer's, or the API cannot queue renders once the
      # renderer is enforcing it.
      - RENDER_AUTH_TOKEN=${RENDER_AUTH_TOKEN:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    # Deliberately NOT published to the host: only `backend` calls this, over
    # the compose network, and anyone who reaches it can queue renders. It was
    # on 3100:3100, which put an unauthenticated render queue on the host.
    expose:
      - "3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
      - RENDER_AUTH_TOKEN=${RENDER_AUTH_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - backend
