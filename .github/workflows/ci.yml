name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/boto3/PyJWT/python-multipart cover importing app.py
      # for the MCP endpoint tests, google-genai covers gemini_worker.
      # scenedetect+yt-dlp are pip-light and are the only things gating
      # main.py's import — without them every main.py test silently skipped
      # in CI (unlocked 15-sep-2026: the download-plan and Gemini-retry
      # tests had never run there).
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart scenedetect yt-dlp
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # The render service is the one place nothing ran: its SSRF guard and its
  # composition metadata are covered by node:test, and neither was executed
  # anywhere before this job existed.
  render-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: render-service/package-lock.json
      - name: Install render-service dependencies
        run: npm ci
        working-directory: render-service
      # The bundle test bundles remotion/src, which resolves Remotion from the
      # remotion/ tree — the two must stay on one version (see 44531f8).
      - name: Install remotion dependencies
        run: npm ci
        working-directory: remotion
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: render-service
      - name: Test
        run: npm test
        working-directory: render-service

  # Neither image was ever built here, so a broken apt/npm step in one only
  # showed up at deploy. These two are cheap; the backend image is not, so it
  # builds on main rather than on every pull request.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: render-service
            dockerfile: render-service/Dockerfile
            context: .
          - name: dashboard
            dockerfile: dashboard/Dockerfile
            context: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  backend-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build .

  # Informational on purpose: an advisory in a transitive dependency is not a
  # reason to block a pull request that has nothing to do with it, but nobody
  # was looking at all before this.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: npm audit (dashboard)
        run: npm audit --audit-level=high
        working-directory: dashboard
      - name: npm audit (render-service)
        run: npm audit --audit-level=high
        working-directory: render-service
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-billing.txt
